<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JobsBOT</title>
    <!-- Favicon Oficial: Isotipo Oficial JobsBOT en verde claro (#4ade80) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.2.23" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Remix Icon CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 Free CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-black bg-[#070709]">
    <div id="root">
      <div id="initial-mobile-splash" style="position:fixed;inset:0;background-color:#070709;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;user-select:none;">
        <style>
          @media (min-width: 768px) {
            #initial-mobile-splash {
              display: none !important;
            }
          }
          @keyframes splashLoading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(120%); }
            100% { transform: translateX(300%); }
          }
        </style>
        <div style="margin-bottom:24px;display:flex;align-items:center;justify-content:center;">
          <img src="/jobot.svg" alt="JobsBOT" style="width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(255,255,255,0.4));" />
        </div>
        <h1 style="color:#ffffff;font-size:20px;font-weight:900;letter-spacing:0.25em;text-transform:uppercase;margin:0 0 24px 0;">
          My JobsBOT
        </h1>
        <div style="width:180px;height:4px;background:#262626;border-radius:9999px;overflow:hidden;position:relative;">
          <div style="width:40%;height:100%;background:#ffffff;border-radius:9999px;box-shadow:0 0 8px rgba(255,255,255,0.8);animation:splashLoading 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
        <style>
          @keyframes splashLoading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(120%); }
            100% { transform: translateX(300%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
